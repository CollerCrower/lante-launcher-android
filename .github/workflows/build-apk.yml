name: Lante Android APK

# Kullanım: GitHub'da bu depoda Actions ▸ "Lante Android APK" ▸ Run workflow.
# Bitince sayfanın altındaki Artifacts bölümünden APK'yı indir.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Mimari (çoğu modern telefon arm64)"
        required: true
        default: "arm64"
        type: choice
        options: ["arm64", "arm", "x86_64", "all"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bu depo (yama)
        uses: actions/checkout@v4

      - name: Zalith Launcher 2 kaynağı (sabit sürüm) + Lante yaması
        run: |
          git clone https://github.com/ZalithLauncher/ZalithLauncher2.git upstream
          cd upstream
          git checkout 0f821414849a428dea1a4506987e5c0c78b5deeb
          git submodule update --init --recursive
          git apply --check ../lante-android.patch
          git apply ../lante-android.patch

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle (debug)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ inputs.arch }}

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: lante-launcher-${{ inputs.arch }}-debug
          path: upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
